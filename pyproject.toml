[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velocity-analytics"
version = "0.1.0"
description = "Prototype: average working days per delivery stage and team from ticket status history (synthetic data)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jaishri Rai" }]
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
velocity-run = "velocity_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
